<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Afruja ♡ Nurislam</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;400;500;600&family=Parisienne&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Manrope",sans-serif;
    color:#71384f;
    background:#ffdce9;
}

/* =====================================================
   OPENING SCREEN
===================================================== */

.opening{
    position:fixed;
    inset:0;
    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    overflow:hidden;

    background:
        radial-gradient(circle at 50% 18%,#ffffff 0%,transparent 23%),
        radial-gradient(circle at 15% 85%,#f5a9ca,transparent 30%),
        radial-gradient(circle at 90% 75%,#d9a6e8,transparent 30%),
        linear-gradient(145deg,#ffddea,#f5b4d0,#dba9e2);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}

.opening.hide{
    opacity:0;
    transform:scale(1.08);
    pointer-events:none;
}

.opening::before{
    content:"";

    position:absolute;
    inset:0;

    background-image:
        radial-gradient(circle,#fff 1px,transparent 1.5px);

    background-size:45px 45px;

    opacity:.35;

    animation:starMove 15s linear infinite;
}

@keyframes starMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-45px);
    }
}

.openGlow{
    position:absolute;

    width:340px;
    height:340px;

    border-radius:50%;

    background:#fff;

    filter:blur(95px);

    opacity:.45;
}

/* =====================================================
   TEDDY
===================================================== */

.teddyArea{
    position:relative;
    z-index:3;

    animation:teddyFloat 3s ease-in-out infinite;
}

.teddyShadow{
    position:absolute;

    width:185px;
    height:35px;

    left:50%;
    bottom:-18px;

    transform:translateX(-50%);

    background:#9c3e70;

    filter:blur(25px);

    opacity:.23;
}

.teddy{
    position:relative;

    width:190px;
    height:190px;

    border-radius:48% 48% 45% 45%;

    background:
        radial-gradient(circle at 35% 25%,
        #ffe8f0,
        transparent 18%),
        linear-gradient(145deg,
        #ffc8dc,
        #f993ba 55%,
        #e76c9c);

    box-shadow:
        inset 12px 10px 23px rgba(255,255,255,.52),
        inset -15px -18px 27px rgba(125,30,70,.14),
        0 32px 65px rgba(100,25,65,.23);

    cursor:pointer;

    transition:.3s;
}

.teddy:active{
    transform:scale(.94);
}

.ear{
    position:absolute;

    width:70px;
    height:70px;

    top:-22px;

    border-radius:50%;

    background:
        linear-gradient(145deg,#ffcede,#ed7fab);

    box-shadow:
        inset 7px 6px 12px rgba(255,255,255,.4);
}

.ear::after{
    content:"";

    position:absolute;

    width:40px;
    height:40px;

    left:15px;
    top:15px;

    border-radius:50%;

    background:#ff9fc5;
}

.ear.left{
    left:3px;
}

.ear.right{
    right:3px;
}

.face{
    position:absolute;

    width:120px;
    height:108px;

    left:35px;
    top:48px;

    border-radius:50%;

    background:#ffb8d0;
}

.eye{
    position:absolute;

    width:12px;
    height:17px;

    top:35px;

    border-radius:50%;

    background:#54233a;
}

.eye.left{
    left:31px;
}

.eye.right{
    right:31px;
}

.eye::after{
    content:"";

    position:absolute;

    width:4px;
    height:5px;

    top:2px;
    left:3px;

    border-radius:50%;

    background:#fff;
}

.nose{
    position:absolute;

    width:19px;
    height:15px;

    left:50%;
    top:52px;

    transform:translateX(-50%);

    border-radius:50%;

    background:#87334f;
}

.mouth{
    position:absolute;

    width:27px;
    height:13px;

    left:50%;
    top:65px;

    transform:translateX(-50%);

    border-bottom:3px solid #87334f;

    border-radius:50%;
}

.blush{
    position:absolute;

    width:26px;
    height:13px;

    top:57px;

    border-radius:50%;

    background:#ff6e9f;

    opacity:.45;

    filter:blur(5px);
}

.blush.left{
    left:8px;
}

.blush.right{
    right:8px;
}

.heartBadge{
    position:absolute;

    right:-18px;
    bottom:-8px;

    font-size:42px;

    animation:heartBeat 1.4s infinite;
}

@keyframes teddyFloat{
    0%,100%{
        transform:translateY(0) rotate(-1deg);
    }

    50%{
        transform:translateY(-14px) rotate(1deg);
    }
}

@keyframes heartBeat{
    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.15);
    }
}

/* =====================================================
   TAP
===================================================== */

.tap{
    position:absolute;

    width:100px;
    height:100px;

    left:50%;
    top:210px;

    transform:translateX(-50%);

    pointer-events:none;
}

.tapIcon{
    font-size:52px;

    text-align:center;

    filter:
        drop-shadow(0 6px 8px rgba(120,30,70,.2));

    animation:tapMove 1.4s infinite;
}

.tapRing{
    position:absolute;

    width:48px;
    height:48px;

    left:26px;
    top:48px;

    border:2px solid white;

    border-radius:50%;

    animation:ring 1.4s infinite;
}

@keyframes tapMove{
    0%,100%{
        transform:translateY(8px);
    }

    50%{
        transform:translateY(-4px);
    }
}

@keyframes ring{
    0%{
        transform:scale(.4);
        opacity:0;
    }

    30%{
        transform:scale(1);
        opacity:1;
    }

    100%{
        transform:scale(1.6);
        opacity:0;
    }
}

/* =====================================================
   OPEN TEXT
===================================================== */

.openText{
    position:relative;

    z-index:3;

    margin-top:72px;

    text-align:center;

    color:white;
}

.openText h1{
    font-family:"DM Serif Display",serif;

    font-size:36px;

    font-weight:400;

    text-shadow:
        0 5px 20px rgba(120,30,70,.15);
}

.openText p{
    margin-top:12px;

    font-size:10px;

    letter-spacing:5px;

    opacity:.9;
}

/* =====================================================
   MAIN BACKGROUND
===================================================== */

.main{
    position:fixed;

    inset:0;

    overflow-y:auto;
    overflow-x:hidden;

    scrollbar-width:none;

    background:
        radial-gradient(circle at 5% 5%,
        #fff3f8,
        transparent 25%),

        radial-gradient(circle at 95% 30%,
        #e7b7ed,
        transparent 24%),

        radial-gradient(circle at 10% 90%,
        #f5b3ce,
        transparent 30%),

        linear-gradient(
            145deg,
            #ffdce9,
            #f7c2dc,
            #e8c5e8
        );
}

.main::-webkit-scrollbar{
    display:none;
}

/* =====================================================
   FLOATING PARTICLES
===================================================== */

.particle{
    position:fixed;

    pointer-events:none;

    z-index:5;

    opacity:.7;

    animation:
        particleFloat linear forwards;
}

@keyframes particleFloat{

    from{
        transform:
            translateY(30px)
            rotate(0);

        opacity:0;
    }

    15%{
        opacity:.8;
    }

    to{
        transform:
            translateY(-110vh)
            rotate(360deg);

        opacity:0;
    }
}

/* =====================================================
   MAIN CARD
===================================================== */

.card{
    width:92%;
    max-width:520px;

    margin:35px auto 90px;

    padding:48px 22px 70px;

    border-radius:42px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.53),
            rgba(255,255,255,.21)
        );

    border:
        1px solid rgba(255,255,255,.72);

    box-shadow:
        0 35px 100px rgba(105,30,75,.18),
        inset 0 1px 2px white;

    backdrop-filter:blur(28px);

    -webkit-backdrop-filter:blur(28px);
}

/* =====================================================
   HEADER
===================================================== */

.smallTitle{
    font-size:10px;

    letter-spacing:5px;

    color:#a14d70;

    margin-bottom:18px;
}

.bigLove{
    font-family:"DM Serif Display",serif;

    font-size:
        clamp(55px,16vw,84px);

    line-height:.9;

    color:#8c3158;

    animation:
        softPulse 3s infinite;
}

.bigLove span{
    display:block;
}

@keyframes softPulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.025);
    }
}

.name{
    margin-top:25px;

    font-family:"Parisienne",cursive;

    font-size:55px;

    color:#a33c68;
}

.names{
    margin-top:4px;

    font-family:Georgia,serif;

    font-style:italic;

    color:#9b5270;

    font-size:14px;
}

.line{
    width:85px;
    height:2px;

    margin:25px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #b35478,
            transparent
        );
}

/* =====================================================
   LETTER
===================================================== */

.letter{
    text-align:left;

    font-family:Georgia,serif;

    font-style:italic;

    color:#713c55;

    font-size:15px;

    line-height:2;
}

.letter p{
    margin-bottom:23px;
}

/* =====================================================
   SECTION TITLES
===================================================== */

.sectionTitle{
    margin-top:45px;

    font-family:"DM Serif Display",serif;

    font-size:30px;

    color:#8d3158;
}

.sectionSub{
    margin-top:9px;

    font-family:Georgia,serif;

    font-style:italic;

    color:#845067;

    font-size:13px;

    line-height:1.8;
}

/* =====================================================
   MEMORY CARDS
===================================================== */

.memories{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:13px;

    margin-top:24px;
}

.memory{
    min-height:170px;

    padding:20px 10px;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    border-radius:26px;

    background:
        rgba(255,255,255,.34);

    border:
        1px solid rgba(255,255,255,.55);

    box-shadow:
        0 12px 30px rgba(100,30,70,.08);

    transition:
        transform .35s ease,
        background .35s ease;
}

.memory:hover{
    transform:
        translateY(-7px)
        scale(1.02);

    background:
        rgba(255,255,255,.5);
}

.icon{
    width:65px;
    height:65px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
        rgba(255,255,255,.65);

    font-size:30px;

    margin-bottom:11px;

    box-shadow:
        0 10px 20px rgba(100,30,70,.08);
}

.memory h3{
    font-family:"DM Serif Display",serif;

    font-size:18px;

    color:#8d3158;
}

.memory p{
    margin-top:7px;

    font-family:Georgia,serif;

    font-style:italic;

    font-size:11px;

    line-height:1.6;

    color:#75445a;
}

/* =====================================================
   QUOTE
===================================================== */

.quote{
    margin-top:30px;

    padding:27px 19px;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.42),
            rgba(255,210,229,.3)
        );

    border:
        1px solid rgba(255,255,255,.6);

    color:#8c3158;

    font-family:"DM Serif Display",serif;

    font-size:21px;

    line-height:1.7;
}

/* =====================================================
   LITTLE THINGS
===================================================== */

.littleGrid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-top:28px;
}

.little{
    padding:21px 11px;

    border-radius:23px;

    background:
        rgba(255,255,255,.28);

    border:
        1px solid rgba(255,255,255,.5);

    transition:.3s;
}

.little:hover{
    transform:translateY(-5px);
}

.littleIcon{
    font-size:29px;

    margin-bottom:9px;
}

.little h3{
    font-size:14px;

    color:#8c3158;
}

.little p{
    margin-top:7px;

    font-size:11px;

    line-height:1.6;

    color:#75445a;
}

/* =====================================================
   CHOCOLATE SECTION
===================================================== */

.chocolateSection{
    margin-top:42px;

    padding:30px 15px;

    border-radius:31px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.42),
            rgba(255,218,232,.25)
        );

    border:
        1px solid rgba(255,255,255,.58);

    box-shadow:
        0 15px 35px rgba(90,25,60,.08);
}

.chocolateArea{
    position:relative;

    width:190px;
    height:155px;

    margin:5px auto 8px;

    animation:
        chocolateFloat 2.8s
        ease-in-out infinite;
}

.chocolateGlow{
    position:absolute;

    width:145px;
    height:50px;

    left:50%;
    bottom:8px;

    transform:translateX(-50%);

    background:#9a5274;

    filter:blur(28px);

    opacity:.23;
}

.chocolate{
    position:absolute;

    width:145px;
    height:82px;

    left:50%;
    top:48px;

    transform:translateX(-50%);

    border-radius:
        13px
        13px
        22px
        22px;

    background:
        linear-gradient(
            145deg,
            #9b5a3e,
            #68301f 45%,
            #432016
        );

    box-shadow:
        inset 8px 7px 14px
            rgba(255,255,255,.2),

        inset -7px -8px 12px
            rgba(0,0,0,.2),

        0 20px 35px
            rgba(70,25,15,.25);
}

.chocolate::before{
    content:"";

    position:absolute;

    inset:9px;

    border-radius:9px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 28px,
            rgba(45,18,10,.38)
            29px 31px
        ),

        repeating-linear-gradient(
            0deg,
            transparent 0 25px,
            rgba(45,18,10,.38)
            26px 28px
        );
}

.chocolate::after{
    content:"LOVE";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        rotate(-5deg);

    font-family:
        "DM Serif Display",
        serif;

    font-size:15px;

    letter-spacing:2px;

    color:
        rgba(255,220,195,.7);

    text-shadow:
        0 1px 3px rgba(0,0,0,.25);
}

/* chocolate wrapper */

.wrapper{
    position:absolute;

    width:165px;
    height:94px;

    left:50%;
    top:42px;

    transform:translateX(-50%);

    border-radius:16px;

    background:
        linear-gradient(
            145deg,
            #f4a9c6,
            #d86696
        );

    opacity:.32;

    z-index:-1;
}

/* ribbon */

.chocoRibbon{
    position:absolute;

    width:24px;
    height:105px;

    left:50%;
    top:35px;

    transform:translateX(-50%);

    background:
        linear-gradient(
            90deg,
            #ffd4e3,
            #ffabc8,
            #ffd4e3
        );

    z-index:4;

    opacity:.95;
}

.chocoBow{
    position:absolute;

    left:50%;
    top:7px;

    transform:translateX(-50%);

    font-size:43px;

    z-index:6;

    filter:
        drop-shadow(
            0 5px 6px
            rgba(100,30,60,.15)
        );
}

.chocoHeart{
    position:absolute;

    right:4px;
    top:52px;

    font-size:27px;

    z-index:7;

    animation:
        heartBeat 1.5s infinite;
}

.chocolateText{
    font-family:
        "DM Serif Display",
        serif;

    font-size:21px;

    color:#8c3158;
}

.chocolateSub{
    margin-top:8px;

    font-family:Georgia,serif;

    font-style:italic;

    font-size:13px;

    line-height:1.7;

    color:#7c4a60;
}

@keyframes chocolateFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50%{
        transform:
            translateY(-9px)
            rotate(1deg);
    }
}

/* =====================================================
   CARE
===================================================== */

.care{
    margin-top:38px;

    padding:28px 18px;

    border-radius:30px;

    background:
        rgba(255,255,255,.27);

    border:
        1px solid rgba(255,255,255,.52);
}

.care h2{
    font-family:"DM Serif Display",serif;

    color:#8c3158;

    font-size:29px;

    margin-bottom:17px;
}

.careItem{
    display:flex;

    align-items:center;

    gap:13px;

    margin-top:11px;

    padding:14px;

    border-radius:20px;

    background:
        rgba(255,255,255,.3);

    text-align:left;

    font-size:12px;

    line-height:1.6;

    color:#714158;
}

.careItem span{
    font-size:25px;
}

/* =====================================================
   PROMISES
===================================================== */

.promiseTitle{
    margin-top:43px;

    font-family:"DM Serif Display",serif;

    font-size:30px;

    color:#8c3158;
}

.promise{
    display:flex;

    align-items:center;

    gap:12px;

    margin-top:13px;

    padding:16px;

    border-radius:22px;

    background:
        rgba(255,255,255,.31);

    border:
        1px solid rgba(255,255,255,.48);

    text-align:left;

    transition:
        transform .3s ease,
        background .3s ease;
}

.promise:hover{
    transform:translateX(5px);

    background:
        rgba(255,255,255,.45);
}

.promise span{
    min-width:30px;

    font-size:25px;
}

.promise p{
    font-family:Georgia,serif;

    font-style:italic;

    font-size:12px;

    line-height:1.7;

    color:#75445a;
}

/* =====================================================
   FINAL MESSAGE
===================================================== */

.final{
    margin-top:45px;

    padding:32px 20px;

    border-radius:33px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.55),
            rgba(255,206,225,.35)
        );

    border:
        1px solid rgba(255,255,255,.7);

    box-shadow:
        0 20px 45px rgba(100,30,70,.1);
}

.final h2{
    font-family:"Parisienne",cursive;

    font-size:48px;

    font-weight:400;

    color:#a33c68;
}

.final p{
    margin-top:20px;

    font-family:Georgia,serif;

    font-style:italic;

    font-size:14px;

    line-height:2;

    text-align:left;

    color:#713c55;
}

.finalHearts{
    margin-top:23px;

    font-size:27px;

    letter-spacing:7px;

    animation:
        heartBeat 1.6s infinite;
}

.signature{
    margin-top:30px;

    font-family:"Parisienne",cursive;

    font-size:40px;

    color:#96355f;
}

.forever{
    margin-top:10px;

    font-size:9px;

    letter-spacing:4px;

    color:#a45a77;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:390px){

    .card{
        width:94%;

        padding:
            42px
            17px
            60px;
    }

    .letter{
        font-size:14px;
    }

    .memory{
        min-height:155px;
    }

    .quote{
        font-size:19px;
    }

    .final h2{
        font-size:42px;
    }
}

@media(max-width:330px){

    .memories,
    .littleGrid{
        grid-template-columns:1fr;
    }

    .teddy{
        transform:scale(.9);
    }

    .openText{
        margin-top:55px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     OPENING
===================================================== -->

<div class="opening" id="opening">

    <div class="openGlow"></div>

    <div class="teddyArea">

        <div class="teddyShadow"></div>

        <div class="teddy" id="teddy">

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="face">
